openapi: 3.0.3
info:
  title: BookManagementSystem API
  version: 1.0.0
  description: OpenAPI documentation for the BookManagementSystem Go service.
servers:
  - url: http://localhost:8080
paths:
  /:
    get:
      summary: Home page
      responses:
        '200':
          description: Welcome message
          content:
            application/json:
              schema:
                type: string
                example: Welcome to the Bookstore Management System
  /books:
    get:
      summary: Get all books
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookDetails'
  /book:
    post:
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          description: Book stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookInput'
  /book/{id}:
    get:
      summary: Get a single book by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetails'
        '400':
          description: Invalid ID format
        '404':
          description: Book not found
    put:
      summary: Update a book by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookInput'
        '400':
          description: Invalid ID format
    delete:
      summary: Delete a book by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '200':
          description: Book deleted successfully
        '400':
          description: Invalid ID format
components:
  schemas:
    BookInput:
      type: object
      required:
        - name
        - writer
        - availability
      properties:
        name:
          type: string
          example: The Go Programming Language
        writer:
          type: string
          example: Alan A. A. Donovan
        availability:
          type: boolean
          example: true
    BookDetails:
      allOf:
        - $ref: '#/components/schemas/BookInput'
        - type: object
          properties:
            _id:
              type: string
              example: 66f1b2c4d2a1f3e4b5c6d7e8